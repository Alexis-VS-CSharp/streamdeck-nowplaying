<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Filtre application">
			<sdpi-textfield setting="filter" placeholder="Apple"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Prochain titre">
			<sdpi-checkbox setting="showNext" default label="Afficher le prochain titre de la file d'attente"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Astuce">
			<span>
				Laisse "Apple" pour cibler Apple Music. La touche affiche artiste/titre et
				un appui met en pause/reprend la lecture. Pour lire le prochain titre, Apple Music ouvre brievement son panneau File d'attente a chaque changement de titre : decoche l'option si ca te gene.
			</span>
		</sdpi-item>
	</body>
</html>

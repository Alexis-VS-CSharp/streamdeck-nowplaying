<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Filtre application">
			<sdpi-textfield setting="filter" placeholder="Apple"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Prochain son">
			<sdpi-checkbox setting="showNext" default label="Annoncer le prochain son a la fin du titre"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Astuce">
			<span>
				Laisse "Apple" pour cibler Apple Music. La touche affiche artiste/titre et
				un appui met en pause/reprend la lecture. Pour lire le prochain son, Apple Music ouvre brievement son panneau File d'attente environ 25 s avant la fin du titre : decoche l'option si ca te gene.</span>
		</sdpi-item>
	</body>
</html>
